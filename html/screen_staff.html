<!-- 運営設定（会場PCで最初に1回だけ） -->
<section id="screen-staff" class="card staff hidden">
  <h2>運営スタッフ用の設定</h2>
  <p class="muted">このPCで最初に1回だけ、運営用の合言葉を入力してください。来場者は入力不要です。</p>
  <form id="staff-form">
    <input id="staff-pass" type="password" autocomplete="off" placeholder="合言葉">
    <div class="actions" style="justify-content:flex-start">
      <button type="submit" class="btn-primary">設定する</button>
    </div>
    <div id="staff-message" class="message"></div>
  </form>
</section>
