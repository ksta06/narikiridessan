<!-- 6.3 採点結果画面 -->
<section id="screen-result" class="hidden">
  <div class="card total">
    <div><span id="total-score" class="score">0</span><span class="unit"><ruby>点<rt>てん</rt></ruby></span></div>
    <div id="rank" class="rank"></div>
    <div class="bars" id="bars"></div>
  </div>
  <div class="card grid-2">
    <div>
      <div class="comment good"><h3>よかったところ</h3><p id="good-points"></p></div>
      <div class="comment improve"><h3>もっとよくなるところ</h3><p id="improvements"></p></div>
      <div class="comment overall"><h3>まとめ</h3><p id="overall"></p></div>
    </div>
    <div>
      <div class="thumbs">
        <div><div class="label">おだい</div><div class="frame"><img class="topic-img" alt="お題画像" draggable="false"></div></div>
        <div><div class="label">あなたの<ruby>絵<rt>え</rt></ruby></div><div class="frame"><img id="result-img" alt="提出画像"></div></div>
      </div>
    </div>
  </div>
  <div class="actions">
    <button class="btn-primary" id="btn-again">もう<ruby>一回<rt>いっかい</rt></ruby>チャレンジ</button>
    <button class="btn-secondary" data-menu="reset">メニューにもどる</button>
  </div>
</section>
